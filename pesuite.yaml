schemaVersion: 1
guard:
  directories:
    repository:
      - apps
      - packages
      - apps/*
      - packages/*
      - node_modules
      - .artifacts
      - .state
      - .github
      - .github/workflows
      - .githooks
      - packages/electron/src/control
      - packages/runtime/src/control
      - packages/guard/src/config
      - packages/guard/src/rules
      - packages/guard/src/scan
      - packages/sidecar/tests/control
      - packages/sidecar/tests/recovery
      - packages/sidecar/tests/process
      - packages/sidecar/tests/binding
      - packages/sidecar/src/state
      - packages/sidecar/src/process
      - packages/sidecar/src/control
      - packages/sidecar/src/runtime
  components:
    - packages/components
runtime:
  appid: io.perish.electronsuite
  carrier: 1
  channel: stable
  name: electron-suite
  namespace: primary
  scheme: electronsuite
  version: 1.0.0
serve:
  data: .state/serve
  sources:
    web:
      directory: apps/web/dist
