name: qualify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  carrier:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: pnpm/action-setup@v5
        with:
          version: 11.13.0
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: 24.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @perish/carrier test
        env:
          PERISH_GUI: "1"
