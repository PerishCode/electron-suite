name: qualify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  carrier:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: pnpm/action-setup@v5
        with:
          version: 11.13.0
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: 24.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @perishcode/carrier test
        env:
          PERISH_GUI: "1"
      - run: |
          node --input-type=module -e 'import { run } from "@perishcode/testkit"; const r = await run({root:process.cwd(), output:process.env.PERISH_REPORT ?? ".artifacts/qualification.json", packaged:process.env.PERISH_PACKAGE === "1"}); if(r.result === "failed") process.exitCode=1;'
        env:
          PERISH_CHROMIUM: "passed"
          PERISH_PACKAGE: "1"
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: qualification-macos
          path: .artifacts/qualification.json
