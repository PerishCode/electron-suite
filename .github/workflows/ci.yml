name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: pnpm/action-setup@v5
        with:
          version: 11.13.0
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: 24.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm exec biome check .
      - run: pnpm exec pesuite guard
      - run: |
          node --input-type=module -e 'import { run } from "@perishcode/testkit"; const r = await run({root:process.cwd(), output:process.env.PERISH_REPORT ?? ".artifacts/qualification.json", packaged:process.env.PERISH_PACKAGE === "1"}); if(r.result === "failed") process.exitCode=1;'
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: qualification-linux
          path: .artifacts/qualification.json
